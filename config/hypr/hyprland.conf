# ===============================
# Hyprland — MacBook Air 2017 (Intel HD 6000)
# ===============================

# --- Monitors ---
# Internal display (usually eDP-1)
monitor = eDP-1, 1440x900@60, 0x0, 1

# --- Workspaces --- 
# Targets Monitor even with external displays
#workspace = 1, monitor:eDP-1
#workspace = 2, monitor:eDP-1
#workspace = 3, monitor:eDP-1
#workspace = 4, monitor:eDP-1
#workspace = 5, monitor:eDP-1
#workspace = 6, monitor:eDP-1
#workspace = 7, monitor:eDP-1
#workspace = 8, monitor:eDP-1
#workspace = 9, monitor:eDP-1
#workspace = 10, monitor:eDP-1

# --- Environment ---
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = WLR_RENDERER_ALLOW_SOFTWARE,0
env = WLR_NO_HARDWARE_CURSORS,1

# --- Autostart ---
exec-once = waybar
exec-once = dunst
exec-once = swww-daemon
exec-once = swww-daemon
exec-once = sh -lc 'swww init; sleep 0.3; swww img "$HOME/Pictures/Wallpapers/theusualsus.jpg"'
exec-once = ~/.config/waybar/scripts/autohide.sh

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
    }
}

# ===============================
# Gestures (new system)
# ===============================
# Replaces the removed:
#   gestures { workspace_swipe = true; workspace_swipe_fingers = 3; }
# This replicates 3-finger horizontal swipe workspace switching.
gesture = 3, horizontal, workspace

# --- General ---
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(8a8a8aff)
    layout = dwindle
    allow_tearing = false
}

# --- Decoration ---
decoration {
    rounding = 10

    active_opacity = 0.92
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        ignore_opacity = false
    }
}

# --- Animations ---
animations {
    enabled = true

    bezier = easeOut, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, easeOut
    animation = windowsOut, 1, 7, easeOut, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Dwindle ---
dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Misc ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    vfr = true
    animate_manual_resizes = false
}

# ===============================
# Keybinds
# ===============================

$mainMod = SUPER
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, F, fullscreen,
bind = $mainMod, Space, exec, kitty
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Move windows with arrow keys
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume / brightness (adjust commands if needed)
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

#Wallpaper
bind = SUPER, W, exec, ~/.local/bin/wallpaper-next.sh

# ===============================
# Window Rules (fixed syntax)
# ===============================

# File pickers / dialogs
windowrule = match:title ^(Open File|Save File|Preferences)$, float on

# Spotify
windowrule = match:class ^(Spotify|spotify|com\.spotify\.Client)$, float on
windowrule = match:class ^(Spotify|spotify|com\.spotify\.Client)$, size 70% 60%
windowrule = match:class ^(Spotify|spotify|com\.spotify\.Client)$, center on

# Notes app
windowrule = match:title ^(Notes)$, float on
windowrule = match:title ^(Notes)$, size 70% 60%
windowrule = match:title ^(Notes)$, center on

# Screenshots
bind = $mainMod, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%F-%T).png
bind = $mainMod SHIFT, S, exec, grim ~/Pictures/screenshot-$(date +%F-%T).png
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" - | wl-copy
